[project]
name = "tickquery"
version = "0.1.0"
description = "Typed Python expression API for server-side DolphinDB tick-data queries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
dolphindb = ["dolphindb>=3.0.6.1"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "pyright==1.1.414",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
